<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" role="img" aria-labelledby="t d">
  <title id="t">Threshold alerting versus trend prediction on a filling disk</title>
  <desc id="d">A fixed 90 percent threshold only reports that a disk is nearly full and repeats until somebody frees space, while predict_linear extrapolates recent free-space samples so the alert fires on the rate of filling and states when the volume will actually run out.</desc>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c9a9a"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#379392"/>
    </marker>
  </defs>

  <style>
    .band  { fill:#f7fafa; stroke:#e6eded; stroke-width:1; }
    .bl    { font:600 11px Roboto,Helvetica,Arial,sans-serif; fill:#8c9a9a; letter-spacing:1.2px; }
    .box   { fill:#ffffff; stroke:#cdcdcd; stroke-width:1.5; }
    .boxa  { fill:#ffffff; stroke:#379392; stroke-width:1.5; }
    .boxk  { fill:#eef7f7; stroke:#379392; stroke-width:1.5; }
    .bt    { font:500 14px Roboto,Helvetica,Arial,sans-serif; fill:#333333; text-anchor:middle; }
    .bs    { font:400 11px Roboto,Helvetica,Arial,sans-serif; fill:#999999; text-anchor:middle; }
    .ln    { stroke:#8c9a9a; stroke-width:1.5; fill:none; }
    .lnt   { stroke:#379392; stroke-width:2; fill:none; }
    .el    { font:400 11px Roboto,Helvetica,Arial,sans-serif; fill:#8c9a9a; text-anchor:middle; }
    .elt   { font:500 11px Roboto,Helvetica,Arial,sans-serif; fill:#379392; text-anchor:middle; }
    .note  { font:400 13px Roboto,Helvetica,Arial,sans-serif; fill:#666666; text-anchor:middle; }
  </style>

  <!-- bands -->
  <rect class="band" x="20" y="44" width="860" height="130" rx="8"/>
  <rect class="band" x="20" y="204" width="860" height="210" rx="8"/>
  <text class="bl" x="38" y="68">THRESHOLD &#183; TELLS YOU THE DISK IS NEARLY FULL</text>
  <text class="bl" x="38" y="228">TREND &#183; TELLS YOU WHEN IT RUNS OUT</text>

  <!-- connectors drawn before boxes -->
  <path class="ln" d="M205,120 L261,120" marker-end="url(#ag)"/>
  <path class="ln" d="M422,120 L478,120" marker-end="url(#ag)"/>
  <path class="ln" d="M639,120 L695,120" marker-end="url(#ag)"/>
  <text class="el" x="233" y="112">scrape</text>
  <text class="el" x="450" y="112">crosses</text>
  <text class="el" x="667" y="112">daily</text>

  <path class="lnt" d="M205,280 L261,280" marker-end="url(#at)"/>
  <path class="lnt" d="M422,280 L478,280" marker-end="url(#at)"/>
  <path class="lnt" d="M639,280 L695,280" marker-end="url(#at)"/>
  <text class="elt" x="233" y="272">sample</text>
  <text class="elt" x="450" y="272">project</text>
  <text class="elt" x="667" y="272">in time</text>

  <!-- band 1 -->
  <rect class="box" x="44"  y="92" width="161" height="56" rx="6"/>
  <text class="bt" x="125" y="117">Disk A:</text>
  <text class="bs" x="125" y="135">91.37% used</text>

  <rect class="box" x="261" y="92" width="161" height="56" rx="6"/>
  <text class="bt" x="341" y="117">Threshold rule</text>
  <text class="bs" x="341" y="135">used &gt; 90%</text>

  <rect class="box" x="478" y="92" width="161" height="56" rx="6"/>
  <text class="bt" x="559" y="117">Email</text>
  <text class="bs" x="559" y="135">still 91% tomorrow</text>

  <rect class="box" x="695" y="92" width="161" height="56" rx="6"/>
  <text class="bt" x="776" y="117">Filtered</text>
  <text class="bs" x="776" y="135">nothing to act on</text>

  <!-- band 2 -->
  <rect class="box" x="44"  y="252" width="161" height="56" rx="6"/>
  <text class="bt" x="125" y="277">Free bytes</text>
  <text class="bs" x="125" y="295">last 6 hours</text>

  <rect class="boxk" x="261" y="252" width="161" height="56" rx="6"/>
  <text class="bt" x="341" y="277">predict_linear</text>
  <text class="bs" x="341" y="295">extrapolate forward</text>

  <rect class="boxa" x="478" y="252" width="161" height="56" rx="6"/>
  <text class="bt" x="559" y="277">Alert</text>
  <text class="bs" x="559" y="295">empty in 4 hours</text>

  <rect class="boxa" x="695" y="252" width="161" height="56" rx="6"/>
  <text class="bt" x="776" y="277">Act</text>
  <text class="bs" x="776" y="295">before it hangs</text>

  <!-- note -->
  <text class="note" x="450" y="345">A disk at 91% has been at 91% for a week, and an alert that arrives every evening stops being read.</text>
  <text class="note" x="450" y="364">The slope is the signal and Prometheus already holds it, so the alert can carry a deadline instead of a level.</text>
  <text class="note" x="450" y="383">The fit is linear, so the range matters: wide enough to ride out a burst, short enough to notice a real change.</text>
</svg>
